<!-- @dsCard group="Recording" height=250 subtitle="Ready and recording, with a live waveform" -->
<div class="vt" style="display:flex;flex-direction:column;gap:32px;padding:32px;background:var(--ground)">
 <div class="vt-rec"><button class="vt-rec__btn" aria-label="Start recording"><svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><rect x="9" y="3" width="6" height="12" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg></button>
  <div class="vt-rec__meta"><span class="vt-rec__timer">0:00 / 3:00</span><span class="vt-label">Tap or press Space</span></div></div>
 <div class="vt-rec"><button class="vt-rec__btn" aria-label="Stop recording"><svg width="30" height="30" viewBox="0 0 24 24"><rect x="5" y="5" width="14" height="14" rx="4" fill="currentColor"/></svg></button>
  <div class="vt-rec__meta"><span class="vt-rec__timer">1:42 / 3:00</span><div class="vt-wave" role="img" aria-label="Input level: good"><i style="height:40%"></i><i style="height:70%"></i><i style="height:100%"></i><i style="height:60%"></i><i style="height:85%"></i><i style="height:45%"></i><i style="height:75%"></i><i style="height:55%"></i><i style="height:90%"></i><i style="height:35%"></i><i style="height:65%"></i><i style="height:50%"></i></div><span class="vt-label" style="color:var(--success)">Good level</span></div></div>
</div>
