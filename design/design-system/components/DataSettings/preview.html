<!-- @dsCard group="Forms" height=430 subtitle="Settings fields and the inline delete confirmation" -->
<div class="vt" style="display:flex;flex-direction:column;gap:16px;padding:24px;background:var(--ground)">
<div class="vt-field"><label for="ds-tz">Time zone</label><select id="ds-tz"><option>America/New_York (detected)</option></select><span class="vt-field__hint">Streaks and the check-in date follow this zone.</span></div>
<p style="margin:0">There's no account. Your profile, plan and recordings are tied to this browser.</p>
<div class="vt-zone">
<b style="font-weight:500">Delete all 14 recordings, your profile and plan?</b>
<span style="font-size:15px;color:var(--muted)">This can't be undone. Your streak and notes go too.</span>
<div style="display:flex;gap:10px;flex-wrap:wrap"><button class="vt-btn vt-btn--danger">Delete my data</button><button class="vt-btn vt-btn--secondary">Keep my data</button></div>
</div>
</div>
