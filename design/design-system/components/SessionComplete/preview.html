  <div style="display:flex;gap:10px;flex-wrap:wrap;position:relative"><span class="vt-chip"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 18V5l11-2v13" fill="none" stroke="var(--primary)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="6.5" cy="18" r="3" fill="var(--primary)"/><circle cx="17.5" cy="16" r="3" fill="var(--primary)"/></svg> +9 notes</span><span class="vt-chip"><svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="var(--sky)" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg> 6:40</span><span class="vt-chip"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="2" y="9" width="3" height="6" rx="1.5" fill="var(--sun-edge)"/><rect x="7" y="5" width="3" height="14" rx="1.5" fill="var(--sun-edge)"/><rect x="12" y="2" width="3" height="20" rx="1.5" fill="var(--sun-edge)"/><rect x="17" y="7" width="3" height="10" rx="1.5" fill="var(--sun-edge)"/></svg> 5 days</span></div>

 </div>
</div>
