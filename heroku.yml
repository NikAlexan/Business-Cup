build:
  docker:
    web: Dockerfile
run:
  # ponytail: web + worker in one dyno — they share the audio disk (Heroku dynos don't share FS).
  # Disk is ephemeral: recordings vanish on the daily restart. Move audio to S3/Postgres to split dynos.
  web: bash -c 'alembic upgrade head && { python -m app.worker & uvicorn app.main:app --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips="*" & wait -n; exit 1; }'
